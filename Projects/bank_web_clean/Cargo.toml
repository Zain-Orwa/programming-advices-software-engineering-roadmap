[package]
name = "bankana-api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
vercel_runtime = { version = "2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
http-body-util = "0.1"

[[bin]]
name = "health"
path = "api/health.rs"

[[bin]]
name = "clients"
path = "api/clients.rs"

[[bin]]
name = "balances_total"
path = "api/balances/total.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3